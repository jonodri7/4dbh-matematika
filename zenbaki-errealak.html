const $ = s => document.querySelector(s);
const LETTERS = 'abcdefghijklmnopqrstuvwxyz';

// ── Zuzen erreala (SVG) ──────────────────────────────
function fmtNum(v) { return String(v).replace('-', '−'); }
function ivSvg(a, b, lc, rc, opts) {
  opts = opts || {};
  const W = 340, H = 64, M = 22, Y = 30;
  let lo = a === null ? b - 5 : a, hi = b === null ? a + 5 : b;
  const span = hi - lo, pad = Math.max(1, Math.round(span * 0.25));
  const min = lo - pad, max = hi + pad;
  const X = v => M + (v - min) / (max - min) * (W - 2 * M);
  const col = opts.color || '#b83b3b';
  let s = `<svg class="iv" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img">`;
  s += `<line x1="6" y1="${Y}" x2="${W-6}" y2="${Y}" stroke="#5a6b80" stroke-width="1.5"/>`;
  s += `<path d="M${W-6} ${Y} l-7 -4 v8 z" fill="#5a6b80"/><path d="M6 ${Y} l7 -4 v8 z" fill="#5a6b80"/>`;
  const ticks = new Set();
  if (max - min <= 16) { for (let v = Math.ceil(min); v <= Math.floor(max); v++) ticks.add(v); }
  else { if (a !== null) ticks.add(a); if (b !== null) ticks.add(b); if (0 > min && 0 < max) ticks.add(0); }
  ticks.forEach(v => {
    const x = X(v);
    s += `<line x1="${x}" y1="${Y-5}" x2="${x}" y2="${Y+5}" stroke="#5a6b80"/>`;
    const strong = v === a || v === b;
    s += `<text x="${x}" y="${Y+21}" font-size="${strong ? 13 : 11}" font-weight="${strong ? 700 : 400}" text-anchor="middle" fill="${strong ? '#1d2a3a' : '#5a6b80'}" font-family="system-ui">${fmtNum(v)}</text>`;
  });
  const x1 = a === null ? 10 : X(a), x2 = b === null ? W - 10 : X(b);
  s += `<line x1="${x1}" y1="${Y}" x2="${x2}" y2="${Y}" stroke="${col}" stroke-width="5" stroke-linecap="butt"/>`;
  if (a === null) s += `<path d="M6 ${Y} l12 -7 v14 z" fill="${col}"/>`;
  if (b === null) s += `<path d="M${W-6} ${Y} l-12 -7 v14 z" fill="${col}"/>`;
  const dot = (v, closed) => `<circle cx="${X(v)}" cy="${Y}" r="6" fill="${closed ? col : '#fff'}" stroke="${col}" stroke-width="2.5"/>`;
  if (a !== null) s += dot(a, lc);
  if (b !== null) s += dot(b, rc);
  return s + '</svg>';
}
function ivTex(a, b, lc, rc) {
  const L = a === null ? '(-\\infty' : (lc ? '[' : '(') + a;
  const R = b === null ? '+\\infty)' : b + (rc ? ']' : ')');
  return `$${L},\\,${R}$`;
}
function ivSet(a, b, lc, rc) {
  let t;
  if (a === null) t = `x ${rc ? '\\le' : '<'} ${b}`;
  else if (b === null) t = `x ${lc ? '\\ge' : '>'} ${a}`;
  else t = `${a} ${lc ? '\\le' : '<'} x ${rc ? '\\le' : '<'} ${b}`;
  return `$\\{x \\,/\\, ${t}\\}$`;
}

// ── Orriak ───────────────────────────────────────────
function home() {
  let h = `<a class="test" href="${TEST_URL}" target="_blank" rel="noopener">📝 Errepaso testa egin (Google kontuarekin)</a>`;
  h += `<p style="margin:0 0 12px;color:var(--muted)">Aukeratu atala:</p><div class="grid">`;
  SECTIONS.forEach(s => {
    const n = s.ex.reduce((t, e) => t + (e.drawer ? 1 : e.it.length), 0);
    h += `<a class="card" href="#${s.id}" data-go="${s.id}"><div class="num">${s.n}. ATALA · ${n} ariketa</div><h2>${s.title}</h2><p>${s.sub}</p></a>`;
  });
  return h + '</div>';
}

function section(idx) {
  const s = SECTIONS[idx];
  let h = `<a class="back" href="#" data-go="">← Atal guztiak</a><h2 class="sec">${s.n}. ${s.title}</h2><p class="secsub">${s.sub}</p>`;
  s.ex.forEach((e, i) => {
    if (e.h) h += `<h3>${e.h}</h3>`;
    h += `<div class="ex"><p class="q">${i + 1}. ${e.q}</p>`;
    if (e.drawer) h += drawerHtml();
    e.it.forEach((it, j) => {
      h += `<div class="item"><span class="lbl">${LETTERS[j]})</span>${it.t}`;
      if (it.fig) h += ivSvg(...it.fig, { color: '#1d2a3a' });
      h += `<details><summary>Ikusi pausuak eta emaitza</summary><div class="sol"><ol>`;
      it.s.forEach(st => h += `<li>${st}</li>`);
      h += `</ol>`;
      if (it.draw) h += ivSvg(...it.draw);
      h += `<div class="ans">Emaitza: ${it.a}</div></div></details></div>`;
    });
    h += `</div>`;
  });
  const prev = SECTIONS[idx - 1], next = SECTIONS[idx + 1];
  h += `<div class="pager">${prev ? `<a href="#${prev.id}" data-go="${prev.id}">← ${prev.n}. ${prev.title}</a>` : '<span></span>'}${next ? `<a href="#${next.id}" data-go="${next.id}">${next.n}. ${next.title} →</a>` : ''}</div>`;
  return h;
}

// ── Marraztu zuk ─────────────────────────────────────
let target = null;
function drawerHtml() {
  return `<div class="drawer">
    <div class="target" id="dTarget"></div>
    <div class="ctrls">
      <label>Ezkerra</label>
      <select id="dL"><option value="[">● [</option><option value="(">○ (</option><option value="inf">−∞</option></select>
      <input type="number" id="dA" value="0">
      <label>Eskuina</label>
      <input type="number" id="dB" value="3">
      <select id="dR"><option value="]">] ●</option><option value=")">) ○</option><option value="inf">+∞</option></select>
    </div>
    <div id="dSvg"></div>
    <div class="ctrls"><button onclick="checkDraw()">Zuzendu</button><button class="sec2" onclick="newTarget()">Beste bat</button></div>
    <div class="fb" id="dFb"></div>
  </div>`;
}
function rnd(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function newTarget() {
  const kind = rnd(0, 4);
  let a = rnd(-6, 3), b = a + rnd(1, 6), lc = Math.random() < .5, rc = Math.random() < .5;
  if (kind === 0) { a = null; lc = false; }
  if (kind === 1) { b = null; rc = false; }
  target = { a, b, lc, rc };
  const asSet = Math.random() < .5;
  $('#dTarget').innerHTML = asSet ? ivSet(a, b, lc, rc) : ivTex(a, b, lc, rc);
  $('#dFb').textContent = '';
  renderMath($('#dTarget'));
  drawStudent();
}
function readStudent() {
  const L = $('#dL').value, R = $('#dR').value;
  const A = Number($('#dA').value), B = Number($('#dB').value);
  $('#dA').disabled = L === 'inf'; $('#dB').disabled = R === 'inf';
  return { a: L === 'inf' ? null : A, b: R === 'inf' ? null : B, lc: L === '[', rc: R === ']' };
}
function drawStudent() {
  const st = readStudent();
  if (st.a !== null && st.b !== null && st.a >= st.b) { $('#dSvg').innerHTML = '<p class="fb ko">Ezkerreko muturrak txikiagoa izan behar du.</p>'; return; }
  $('#dSvg').innerHTML = ivSvg(st.a, st.b, st.lc, st.rc, { color: '#2b6cb0' });
}
function checkDraw() {
  const st = readStudent(), t = target, fb = $('#dFb');
  const errs = [];
  if ((st.a === null) !== (t.a === null) || (st.a !== null && st.a !== t.a)) errs.push('ezkerreko muturra');
  else if (t.a !== null && st.lc !== t.lc) errs.push('ezkerreko puntua (betea/hutsa)');
  if ((st.b === null) !== (t.b === null) || (st.b !== null && st.b !== t.b)) errs.push('eskuineko muturra');
  else if (t.b !== null && st.rc !== t.rc) errs.push('eskuineko puntua (betea/hutsa)');
  if (!errs.length) { fb.textContent = 'Ondo! Primeran marraztuta.'; fb.className = 'fb ok'; }
  else { fb.textContent = 'Begiratu: ' + errs.join(' eta ') + '.'; fb.className = 'fb ko'; }
}
function initDrawer() {
  if (!$('#dTarget')) return;
  ['#dL', '#dR', '#dA', '#dB'].forEach(id => $(id).addEventListener('input', drawStudent));
  newTarget();
}

// ── Nabigazioa ───────────────────────────────────────
function renderMath(el) {
  if (window.renderMathInElement) renderMathInElement(el, { delimiters: [{ left: '$', right: '$', display: false }], throwOnError: false });
}
function show(id) {
  const idx = SECTIONS.findIndex(s => s.id === id);
  $('#app').innerHTML = idx < 0 ? home() : section(idx);
  renderMath($('#app'));
  initDrawer();
  window.scrollTo(0, 0);
}
function route() { let id = ''; try { id = decodeURIComponent(location.hash.slice(1)); } catch (e) {} show(id); }
// Navegación por JS (funciona también en vistas previas donde los enlaces # están bloqueados)
document.addEventListener('click', e => {
  const a = e.target.closest('[data-go]');
  if (!a) return;
  e.preventDefault();
  const id = a.getAttribute('data-go');
  show(id);
  try { history.pushState(null, '', id ? '#' + id : location.pathname + location.search); } catch (err) {}
});
window.addEventListener('popstate', route);
window.addEventListener('hashchange', route);
route();
// Fórmulas: si KaTeX llega después, volver a pintarlas
window.addEventListener('load', () => renderMath(document.getElementById('app')));
</script>
